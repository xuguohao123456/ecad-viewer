name: Publish to Docker (Local Download)

on:
  push:
    tags:
      - 'ecad-renderer-v*' # 触发规则保持不变
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish-ecad-viewer-service-arm64:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 如果是手动触发，则拉取输入的tag；否则使用推送时对应的 tag
          ref: ${{ github.event.inputs.tag_name || github.ref_name }}

      # 2. 设置 QEMU 模拟器以支持编译 ARM64 架构
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx 构建工具
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to tens
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.ccr_name }}
          password: ${{ secrets.ccr_passowrd }}

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: 
          build-args: ${{ secrets.image_name }}
            IMAGE_TAG=lite
            
      # 5. 上传到 Actions 的 Artifacts，让您能在网页端点击下载
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecad-viewer-service-arm64-image
          path: /tmp/ecad-viewer-service-arm64.tar
          retention-days: 7
