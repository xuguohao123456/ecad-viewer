name: Publish to Docker (Local Download)

on:
  push:
    tags:
      - 'ecad-renderer-v*' # 触发规则保持不变
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish-ecad-viewer-service-arm64:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to tens
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.ccr_name }}
          password: ${{ secrets.ccr_passowrd }}

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
