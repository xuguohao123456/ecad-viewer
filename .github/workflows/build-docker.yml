name: Publish to Docker (Local Download)

on:
  push:
    tags:
      - 'ecad-renderer-v*' # 触发规则保持不变
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish-ecad-viewer-service-arm64:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 如果是手动触发，则拉取输入的tag；否则使用推送时对应的 tag
          ref: ${{ github.event.inputs.tag_name || github.ref_name }}

      # 2. 设置 QEMU 模拟器以支持编译 ARM64 架构
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx 构建工具
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 关键变动：构建 ARM64 镜像，并不 push，而是直接导出为本地 tar 镜像包
      - name: Build ARM64 container
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64  # 👈 锁定编译为 ARM64 架构
          push: false             # 👈 关闭远程推送
          outputs: type=docker,dest=/tmp/ecad-viewer-service-arm64.tar # 👈 导出为本地文件
          tags: ghcr.io/huaqiu-electronics/ecad-viewer-service:${{ github.event.inputs.tag_name || github.ref_name }}
          build-args: |
            IMAGE_TAG=${{ github.event.inputs.tag_name || github.ref_name }}

      # 5. 上传到 Actions 的 Artifacts，让您能在网页端点击下载
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecad-viewer-service-arm64-image
          path: /tmp/ecad-viewer-service-arm64.tar
          retention-days: 7
